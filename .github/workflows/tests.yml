name: tests

on:
  push:
  pull_request:

# Read-only token. Nothing in this workflow writes to the repo.
permissions:
  contents: read

# No secrets anywhere in CI: every HTTP call in the tests is mocked with respx,
# and the triage core never needs a key to run. Empty keys prove it.
env:
  VT_API_KEY: ""
  ABUSEIPDB_API_KEY: ""

jobs:
  lint:
    name: Lint and rules check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      # Separate from the tests on purpose, so a bad rule fails the build even
      # if someone skips or deselects the tests.
      - name: Behavior rules load and use known ATT&CK techniques
        run: python scripts/check_rules.py

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 matches the development venv; 3.12 is an older version still in use.
        python-version: ["3.14", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans the commits in the push or pull request.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A personal-account repo needs no GITLEAKS_LICENSE. PR comments are off
          # so the token can stay read-only; a finding still fails the job.
          GITLEAKS_ENABLE_COMMENTS: "false"
