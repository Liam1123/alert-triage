# Behavior detection rules, loaded and validated by rules.py at startup.
#
# Each rule:
#   id           unique snake_case id
#   name         short human-readable name
#   description  what the rule catches and why it matters
#   techniques   MITRE ATT&CK technique IDs (checked against data/attack_techniques.json)
#   severity     low | medium | high   (high → malicious, medium → suspicious, low → context only)
#   match        a group: all_of (every item must match) or any_of (at least one)
#                Items are conditions {field, regex} or nested groups.
#
# Fields:  command_line, file_path, parent_process, image (the process file name),
#          original_file_name (the OriginalFileName in the PE header; unlike the
#          name on disk, renaming the file doesn't change it)
# Regexes are case-insensitive. YAML single quotes keep backslashes literal;
# write '' for a literal single quote.
#
# A condition with `differs_from: <field>` only matches when the two fields hold
# different file names (case-insensitive, a missing .exe ignored).
#
# Rules about a specific program identify it by image name OR original file
# name, so a copy renamed to cu.exe is still certutil.
#
# Text is deobfuscated before matching: carets (^) and empty quote pairs ("")
# are removed and repeated whitespace is collapsed, so "p^ow^er""shell" is
# matched as "powershell".
#
# Common pieces repeated below:
#   user-writable path:  \\(temp|tmp|appdata|downloads|programdata)\\|%(temp|tmp|appdata|localappdata|programdata)%

rules:
  - id: encoded_powershell
    name: Encoded PowerShell command
    description: >
      PowerShell run with -EncodedCommand or one of its abbreviations (-e, -ec,
      -en, -enc, ...). Encoding hides the real script from command-line logging
      and is a common way to launch malicious PowerShell.
    techniques: [T1059.001]
    severity: medium
    match:
      all_of:
        - any_of:
            - field: image
              regex: '^(powershell|pwsh)(\.exe)?$'
            - field: command_line
              regex: '\b(powershell|pwsh)(\.exe)?\b'
            # pwsh.exe's version resource names pwsh.dll.
            - field: original_file_name
              regex: '^(powershell(\.exe)?|pwsh\.dll)$'
        # PowerShell accepts -, / and Unicode dashes (en dash, em dash, horizontal bar)
        # before a parameter, and any unambiguous prefix of -EncodedCommand.
        - field: command_line
          regex: '(?<!\S)[-/–—―](e|ec|en|enc|enco|encod|encode|encoded|encodedc|encodedco|encodedcom|encodedcomm|encodedcomma|encodedcomman|encodedcommand)\s+["'']?[a-z0-9+/=]{16,}'

  - id: powershell_download_cradle
    name: PowerShell download cradle
    description: >
      PowerShell code that downloads content from the network (DownloadString,
      Invoke-WebRequest, Net.WebClient, BITS, ...), usually to run it in memory
      with IEX. Download-and-execute is the classic way to pull a second-stage
      payload. IEX on its own runs a string that's already on the machine, so it
      doesn't count here without a network method. curl and wget count only
      when PowerShell is running (there they're aliases for Invoke-WebRequest);
      a plain curl.exe from cmd or a script is everyday admin work.
    techniques: [T1059.001, T1105]
    severity: high
    match:
      any_of:
        - field: command_line
          regex: '\b(downloadstring|downloadfile|downloaddata|invoke-webrequest|iwr|start-bitstransfer)\b'
        - field: command_line
          regex: '\bnet\.webclient\b'
        - all_of:
            - field: command_line
              regex: '\b(curl|wget)\b'
            # PowerShell is the process, or the command line starts it.
            - any_of:
                - field: image
                  regex: '^(powershell|pwsh)(\.exe)?$'
                - field: original_file_name
                  regex: '^(powershell(\.exe)?|pwsh\.dll)$'
                - field: command_line
                  regex: '\b(powershell|pwsh)(\.exe)?\b'

  - id: clipboard_execution
    name: PowerShell executes clipboard contents
    description: >
      PowerShell reading the clipboard ([Windows.Forms.Clipboard]::GetText() or
      Get-Clipboard) and running it as code with iex/Invoke-Expression or by
      assigning it to a function ($function:). Whatever the user was tricked into
      copying becomes the payload, as in "paste this to fix it" lures. Reading
      the clipboard on its own is normal admin work; running it is not.
    techniques: [T1059.001, T1204.004]
    severity: high
    match:
      all_of:
        - field: command_line
          regex: '\[(system\.)?windows\.forms\.clipboard\]::gettext\b|\bget-clipboard\b'
        - field: command_line
          regex: '\b(iex|invoke-expression)\b|\$function:'

  - id: char_shift_decoding
    name: Character-shift string decoding
    description: >
      A loop that rebuilds a string by shifting every character by a constant
      ([char]([int]$c - 3)) and then runs the result via $function:, iex, or the
      & call operator. It hides the real command from logs and string matching.
      The shifted text is decoded (never run) and checked against these rules too.
    techniques: [T1027]
    severity: medium
    match:
      all_of:
        # The shift. Mirrors CHAR_SHIFT_PATTERN in behavior.py.
        - field: command_line
          regex: '\[char\]\s*\(\s*[^()]{0,80}\$[^()]{0,80}[-+]\s*\d{1,3}\s*\)'
        # A loop around it.
        - field: command_line
          regex: '\b(foreach|for|while)\s*\(|\bforeach-object\b|%\s*\{'
        # Running what it built.
        - field: command_line
          regex: '\$function:|\b(iex|invoke-expression)\b|(^|[;{(|]\s*)&\s*[$(\[{]'

  - id: certutil_download
    name: Certutil download or decode
    description: >
      certutil.exe used to download a file (-urlcache) or decode a base64
      payload (-decode). Both are well-known living-off-the-land abuses of a
      certificate tool.
    techniques: [T1105, T1140]
    severity: high
    match:
      all_of:
        - any_of:
            - field: command_line
              regex: '\bcertutil(\.exe)?\b'
            - field: original_file_name
              regex: '^certutil(\.exe)?$'
        - field: command_line
          regex: '[-/](urlcache|decode|decodehex)\b'

  - id: mshta_execution
    name: Mshta executing a URL or script
    description: >
      mshta.exe running a remote URL, inline VBScript/JavaScript, or a script
      file. Mshta runs HTML applications outside the browser sandbox.
    techniques: [T1218.005]
    severity: high
    match:
      any_of:
        - field: command_line
          regex: '\bmshta(\.exe)?["'']?\s+["'']?(https?://|vbscript:|javascript:|\S+\.(hta|sct|js|vbs)\b)'
        # A renamed copy: the PE header says mshta, and an argument is a URL or script.
        - all_of:
            - field: original_file_name
              regex: '^mshta(\.exe)?$'
            - field: command_line
              regex: '\s["'']?(https?://|vbscript:|javascript:|\S+\.(hta|sct|js|vbs)\b)'

  - id: regsvr32_squiblydoo
    name: Regsvr32 remote scriptlet (Squiblydoo)
    description: >
      regsvr32.exe with /i: pointing at a URL or loading scrobj.dll, which runs
      a remote or local COM scriptlet while bypassing application allowlisting.
    techniques: [T1218.010]
    severity: high
    match:
      all_of:
        - any_of:
            - field: command_line
              regex: '\bregsvr32(\.exe)?\b'
            - field: original_file_name
              regex: '^regsvr32(\.exe)?$'
        - field: command_line
          regex: '[-/]i:'
        - any_of:
            - field: command_line
              regex: 'https?://'
            - field: command_line
              regex: '\bscrobj(\.dll)?\b'

  - id: rundll32_user_path
    name: Rundll32 with a user-writable path
    description: >
      rundll32.exe running from, or referencing a file in, a user-writable
      folder (Temp, AppData, Downloads, ProgramData). Legitimate rundll32 use
      almost always loads DLLs from System32 or Program Files.
    techniques: [T1218.011]
    severity: medium
    match:
      all_of:
        - any_of:
            - field: image
              regex: '^rundll32(\.exe)?$'
            - field: command_line
              regex: '\brundll32(\.exe)?\b'
            - field: original_file_name
              regex: '^rundll32(\.exe)?$'
        - any_of:
            - field: command_line
              regex: '\\(temp|tmp|appdata|downloads|programdata)\\|%(temp|tmp|appdata|localappdata|programdata)%'
            - field: file_path
              regex: '\\(temp|tmp|appdata|downloads|programdata)\\'

  - id: office_spawns_shell
    name: Office application spawned a shell or script host
    description: >
      Word, Excel, PowerPoint, or Outlook launching cmd, PowerShell, a script
      host, mshta, or rundll32. This is the typical result of a malicious macro
      or attachment being opened.
    techniques: [T1566.001, T1204.002]
    severity: high
    match:
      all_of:
        - field: parent_process
          regex: '(^|\\)(winword|excel|powerpnt|outlook)\.exe$'
        - any_of:
            - field: image
              regex: '^(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32)\.exe$'
            # The program at the start of the command line, with or without a path.
            - field: command_line
              regex: '^"?([a-z]:\\([^"\\]+\\)*)?(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32)(\.exe)?"?(\s|$)'

  - id: schtasks_create
    name: Scheduled task created
    description: >
      schtasks.exe /create registers a scheduled task. Attackers use it for
      persistence and to run payloads as SYSTEM. Admins use it too, so it is
      medium on its own.
    techniques: [T1053.005]
    severity: medium
    match:
      all_of:
        - field: command_line
          regex: '\bschtasks(\.exe)?\b.*[-/]create\b'

  - id: registry_run_key
    name: Registry Run key modified
    description: >
      reg add writing to a Run or RunOnce key, which starts a program every
      time a user logs on.
    techniques: [T1547.001]
    severity: medium
    match:
      all_of:
        - field: command_line
          regex: '\breg(\.exe)?\s+add\b.*\\currentversion\\run(once)?\b'

  - id: shadow_copy_deletion
    name: Volume shadow copies deleted
    description: >
      Deleting shadow copies with vssadmin or wmic stops the system from being
      restored. Ransomware almost always does this right before encrypting.
    techniques: [T1490]
    severity: high
    match:
      any_of:
        - field: command_line
          regex: '\bvssadmin(\.exe)?\b.*\bdelete\s+shadows\b'
        - field: command_line
          regex: '\bwmic(\.exe)?\b.*\bshadowcopy\b.*\bdelete\b'

  - id: lsass_dump
    name: LSASS memory dump
    description: >
      Dumping lsass.exe memory with procdump or comsvcs.dll MiniDump to steal
      credentials offline.
    techniques: [T1003.001]
    severity: high
    match:
      any_of:
        - field: command_line
          regex: '\bprocdump(64)?(\.exe)?\b.*\blsass\b'
        # A renamed procdump (Sysinternals' version resource says "procdump").
        - all_of:
            - field: original_file_name
              regex: '^procdump(64)?(\.exe)?$'
            - field: command_line
              regex: '\blsass\b'
        - field: command_line
          regex: '\bcomsvcs(\.dll)?\b.*(minidump|#\s*24\b)'

  - id: renamed_system_binary
    name: Renamed system binary
    description: >
      The PE header says this is a Windows or Sysinternals tool (certutil,
      mshta, regsvr32, rundll32, powershell, cmd, procdump, wscript, cscript),
      but the file on disk has another name. Renaming a built-in tool is how
      attackers slip past rules and allowlists that go by file name, and
      legitimate software almost never does it.
    techniques: [T1036.003]
    severity: high
    match:
      all_of:
        - field: original_file_name
          regex: '^(certutil|mshta|regsvr32|rundll32|powershell|cmd|procdump(64)?|wscript|cscript)(\.exe)?$'
          differs_from: image
        # Not a check: puts the name on disk next to the original in the evidence.
        - field: image
          regex: '.+'

  - id: discovery_commands
    name: Discovery commands
    description: >
      whoami, net user/group, nltest, or systeminfo. Common hands-on-keyboard
      reconnaissance, but also everyday admin work, so it is context only.
    techniques: [T1033, T1087, T1082]
    severity: low
    match:
      any_of:
        - field: command_line
          regex: '\b(whoami|nltest|systeminfo)(\.exe)?\b'
        - field: command_line
          regex: '\bnet1?(\.exe)?\s+(user|group)\b'

  - id: user_writable_execution
    name: Execution from a user-writable folder
    description: >
      A program running from Temp, Downloads, or AppData. Malware often lands
      and runs there, but so do installers and some per-user apps, so it is
      context only.
    techniques: [T1204.002]
    severity: low
    match:
      any_of:
        - field: file_path
          regex: '\\(temp|tmp|downloads|appdata)\\'
        # The program at the start of the command line lives in one of those folders.
        - field: command_line
          regex: '^("[^"]*|[^"\s]*)(\\(temp|tmp|downloads|appdata)\\|%(temp|tmp|appdata|localappdata)%)'
